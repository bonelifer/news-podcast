name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install flake8 -r requirements.txt
      - name: flake8
        run: flake8 --max-line-length 100 news_podcast.py
      - name: Help output and config template load
        run: |
          python news_podcast.py --help
          python news_podcast.py run --help
          python -c "import configparser; p = configparser.ConfigParser(interpolation=None); p.read('config.ini.example'); assert any(s.startswith('section:') for s in p.sections())"
